services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finflow-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - finflow-network
    expose:
      - "8000"

networks:
  finflow-network:
    # Общая сеть между отдельными контейнерами фронтенда и бэкенда
    external: true
