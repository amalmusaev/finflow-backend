services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finflow-backend
    restart: unless-stopped
    volumes:
      # Сохранение базы данных SQLite на хост-машине
      - ./database:/app/database
    environment:
      - APP_NAME=FinFlow
      - APP_VERSION=0.1.0
      - DEBUG=False
      - DATABASE_URL=sqlite+aiosqlite:///./database/app.db
    networks:
      - finflow-network
    expose:
      - "8000"

networks:
  finflow-network:
    # Общая сеть между отдельными контейнерами фронтенда и бэкенда
    external: true
