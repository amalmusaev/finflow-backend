services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finflow-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - finflow-network
    expose:
      - "8000"

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finflow-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - finflow-network
    ports:
      - "8001:8001"
    command: ["uv", "run", "python", "-m", "src.mcp.server", "--transport", "streamable-http", "--port", "8001", "--host", "0.0.0.0"]

networks:
  finflow-network:
    # Общая сеть между отдельными контейнерами фронтенда и бэкенда
    external: true
